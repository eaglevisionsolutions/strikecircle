<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Signing you in…</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body{font-family:system-ui,Segoe UI,Arial,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;background:#f7f7f7;color:#333}
    .card{background:#fff;padding:24px 28px;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,0.08);max-width:420px;width:100%;text-align:center}
    .spinner{width:28px;height:28px;border:3px solid #ddd;border-top-color:#09f;border-radius:50%;animation:spin 1s linear infinite;margin:16px auto}
    @keyframes spin{to{transform:rotate(360deg)}}
    a{color:#09f}
  </style>
</head>
<body>
  <div class="card">
    <h2>Signing you in…</h2>
    <div class="spinner"></div>
    <p>Please wait while we finish your sign-in.</p>
    <p><small>If this takes too long, <a href="/login">go back</a>.</small></p>
  </div>
  <script>
    (async function(){
      try {
        // Attempt to exchange refresh cookie for access token
        const csrf = document.cookie.split('; ').reduce((a,c)=>{const[k,v]=c.split('=');return k==='refresh_csrf'?decodeURIComponent(v):a;}, '');
        const r = await fetch('/api/v1/auth/refresh', {method:'POST', headers:{'X-Refresh-CSRF': csrf}, credentials:'include'});
        if (r.ok) {
          const j = await r.json().catch(()=>({}));
          if (j && j.data && j.data.access_token) {
            // Stash the access token for app usage
            try { localStorage.setItem('access_token', j.data.access_token); } catch(e) {}
          }
          window.location.replace('/dashboard');
          return;
        }
      } catch(e) {}
      window.location.replace('/login?oauth=failed');
    })();
  </script>
</body>
</html>
